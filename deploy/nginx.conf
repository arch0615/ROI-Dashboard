# ad-genius Nginx vhost — production config, what's actually deployed
# at /etc/nginx/sites-available/ad-genius. To reproduce on a fresh box:
#
#   1. Substitute every dash.pushudc.top with the new FQDN.
#   2. Drop the two `listen 443 ssl` lines + ssl_certificate /
#      ssl_certificate_key / ssl_dhparam / include lines, AND drop
#      the second server block (the port-80 -> port-443 redirect).
#      Replace with a minimal `listen 80` + `server_name <fqdn>` block.
#   3. cp this to /etc/nginx/sites-available/<name>
#      ln -s ... /etc/nginx/sites-enabled/<name>
#      nginx -t && systemctl reload nginx
#   4. certbot --nginx -d <fqdn> --agree-tos --email <addr> --redirect
#      Certbot edits the file in place to add ssl_* lines + the
#      port-80 -> port-443 redirect server block. The result matches
#      what's checked in below.

server {
    server_name dash.pushudc.top;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript;

    # Backend API: Express on 127.0.0.1:4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend: Next.js on 127.0.0.1:3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dash.pushudc.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dash.pushudc.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dash.pushudc.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dash.pushudc.top;
    return 404; # managed by Certbot
}
