# ad-genius Nginx vhost. Substitute __DOMAIN__ with the real FQDN before
# applying. After substitution:
#   sudo ln -s /home/ad-genius/deploy/nginx.conf /etc/nginx/sites-enabled/ad-genius
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d __DOMAIN__

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Cert challenge + redirect everything else to HTTPS (after cert issuance).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript;

    # Backend API: Express on 127.0.0.1:4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend: Next.js on 127.0.0.1:3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
